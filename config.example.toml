# tabkeeper configuration.
#
# Copy this file to the path printed by `tabkeeper config` and adjust it.
# Every setting is optional; the values below are the defaults.

[llm]
# Only OpenAI-compatible chat-completions servers are supported so far. That
# covers Ollama, LM Studio, llama.cpp server, vLLM, OpenRouter and OpenAI.
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"   # Ollama
model = "llama3.1:8b"
# Name of the environment variable that holds the API key. Leave unset for
# local servers that need no key, e.g. api_key_env = "OPENAI_API_KEY".
# api_key_env = "OPENAI_API_KEY"
# How the model is told to answer in JSON: "json_schema" (strict schema,
# preferred), "json_object" (any JSON) or "none" (prompt instructions only).
structured_output = "json_schema"
# Page text is cut to this many characters before it is sent to the model.
max_input_chars = 12000
temperature = 0.2
# Local models can be slow on long pages.
timeout_secs = 300
# Retries after a connection error, timeout, HTTP 429 or server error, with
# increasing waits (honoring Retry-After). After that the run stops, and
# running it again continues where it stopped.
retries = 3
# Limit on requests per minute, for cloud APIs with rate limits. 0: no limit.
requests_per_minute = 0
# Prices in US dollars per million tokens, for cost estimates (--dry-run),
# --max-cost and the report. Leave at 0 for local models.
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0

# Extra fields added to every request, for server-specific options.
# Thinking models (qwen3, deepseek-r1, gpt-oss, ...) spend minutes per page
# reasoning before they answer. On Ollama this turns that off, which makes
# them roughly 50 times faster:
# [llm.extra_body]
# reasoning_effort = "none"

[embeddings]
# Embeddings pick which existing tags the model sees for each page: the most
# similar to the page. Without them tabkeeper shows the most used tags, which
# works less well once there are hundreds of tags.
# On Ollama: ollama pull nomic-embed-text
enabled = true
model = "nomic-embed-text"
# Server and API key default to the [llm] ones.
# base_url = "http://localhost:11434/v1"
# api_key_env = "OPENAI_API_KEY"
# How much of each page's text is embedded to pick its tags.
page_chars = 2000
timeout_secs = 60
# US dollars per million tokens; 0 for local models.
price_per_mtok = 0.0

[fetch]
timeout_secs = 20
# Retries after a timeout, connection error, HTTP 429 or server error.
retries = 2
user_agent = "Mozilla/5.0 (compatible; tabkeeper/0.1; +https://github.com/agegechkori/tabkeeper)"

[tags]
# Maximum tags per page, and how many of them may be new tags.
max_per_page = 5
max_new_per_page = 3
# How many existing tags are shown to the model for each page.
vocabulary_limit = 50
# Maximum number of levels in the tag tree, e.g. technology/ai/llm is 3.
# The tree is built at the end of a run; not implemented yet.
max_depth = 3

[filter]
# "deny": skip URLs matching any rule. "allow": process only URLs matching a
# rule. Browser-internal and local URLs (chrome://, about:, file://) are
# always skipped. --allow and --deny add rules for one run.
mode = "deny"
rules = [
  # "domain:bank.example.com",          # the domain and its subdomains
  # "glob:https://*.corp.internal/*",
  # "regex:^https://mail\\.google\\.com/",
  # "prefix:http://localhost",
]

[reconcile]
# The tag review: merges tags that mean the same (board-game / board-games,
# ml / machine-learning) and splits tags used for different meanings (rust
# for the language and for corrosion). Code proposes candidates, the model
# decides, and you approve the changes. Runs at the end of every import, or
# with `tabkeeper revise-tags`.
at_end_of_run = true
# The review is only a few requests per run, so a stronger model, or a
# thinking model allowed to think, is affordable here. Defaults to [llm].
# The report prices its tokens with the prices in [llm].
# model = "qwen3:8b"
# [reconcile.extra_body] replaces [llm.extra_body] for the review; an empty
# table lets a thinking model think.
# Tags whose names are at least this similar (cosine similarity of their
# embeddings) are checked for being the same tag.
similarity = 0.80
# Tags on at least this many pages are checked for covering different
# meanings, when their pages fall into two groups at most this similar.
split_min_pages = 3
split_similarity = 0.75
# Tag pairs per review request.
batch_size = 20

[notes]
# The note's title: "both" (the page's own title, then the model's in
# parentheses), "page" (the page's own title, as in the browser tab) or
# "summary" (the model's title).
title = "both"

[run]
# Pages processed at the same time. Local servers such as Ollama handle a
# few requests at once; more mainly helps with fetching.
concurrency = 4
# Pages fetched at the same time from one domain.
per_domain = 2
# The first pages are processed one at a time, so their tags are there for
# the pages that follow.
sequential_start = 20
