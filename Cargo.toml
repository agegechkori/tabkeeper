[package]
name = "tabkeeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Summarize and tag every open browser tab into Markdown notes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agegechkori/tabkeeper"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dom_smoothie = "0.18.2"
encoding_rs = "0.8.35"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.19"
indicatif = "0.18.6"
libc = "0.2.189"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli", "deflate", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.6"
url = "2.5.8"
whatlang = "0.18.0"

[dev-dependencies]
tempfile = "3.27.0"
